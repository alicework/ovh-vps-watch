name: Stock VPS OVH

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      plan_code:
        description: planCode OVH (vide = vps-2027-model2)
        required: false
      datacenters:
        description: Codes de datacenters séparés par des espaces (vide = France)
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: watch

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: ./watch.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTIFY_USER: ${{ github.repository_owner }}
          # Vides au déclenchement planifié : watch.sh retombe sur ses défauts.
          PLAN_CODE: ${{ inputs.plan_code }}
          DATACENTERS: ${{ inputs.datacenters }}
